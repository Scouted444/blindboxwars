name: Build Blind Box Wars (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Game/Library
          key: library-${{ hashFiles('Game/Packages/manifest.json') }}-${{ github.sha }}
          restore-keys: |
            library-${{ hashFiles('Game/Packages/manifest.json') }}-
            library-

      - name: Install Unity
        id: unity-setup
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: '2022.3'
          version-file: 'None'
          build-targets: StandaloneWindows64

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Windows player
        shell: pwsh
        run: |
          $editor = "${{ steps.unity-setup.outputs.unity-editor-path }}"
          $proj = Join-Path $env:GITHUB_WORKSPACE "Game"
          $log = Join-Path $proj "build.log"
          Write-Host "Editor: $editor"
          $args = @('-batchmode', '-nographics', '-quit', '-projectPath', "`"$proj`"", '-executeMethod', 'BBBuild.Build', '-logFile', "`"$log`"")
          $p = Start-Process -FilePath $editor -ArgumentList $args -Wait -PassThru -NoNewWindow
          if (Test-Path $log) { Get-Content $log -Tail 250 }
          if ($p.ExitCode -ne 0) { Write-Error "Unity exited with $($p.ExitCode)"; exit 1 }
          if (!(Test-Path "$proj\Build\BlindBoxWars\BlindBoxWars.exe")) { Write-Error "No exe produced"; exit 1 }
          Compress-Archive -Path "$proj\Build\BlindBoxWars\*" -DestinationPath "$env:GITHUB_WORKSPACE\BlindBoxWars-Windows.zip"

      - name: Publish build log to ci-logs branch
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ci-logs"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE "Game/build.log"
          if (Test-Path $log) {
            # Drop any line containing an e-mail address before publishing (repo is public).
            Get-Content $log | Where-Object { $_ -notmatch '@' } | Set-Content (Join-Path $dir "build.log")
            Get-Content $log | Select-String -Pattern 'error CS|Shader error|BUILD RESULT|Exception' | ForEach-Object { $_.Line } | Where-Object { $_ -notmatch '@' } | Set-Content (Join-Path $dir "errors.txt")
          }
          "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" | Set-Content (Join-Path $dir "status.txt")
          Set-Location $dir
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${{ github.run_number }}: ${{ job.status }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-logs

      - name: Publish download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Blind Box Wars - build ${{ github.run_number }}
          body: Download BlindBoxWars-Windows.zip, unzip it, and run BlindBoxWars.exe.
          files: BlindBoxWars-Windows.zip
          make_latest: true
